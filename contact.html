<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engineering College — Контакты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Engineering College</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">О нас и Программы</a></li>
          <li class="nav-item"><a class="nav-link" href="admissions.html">Поступление</a></li>
          <li class="nav-item"><a class="nav-link" href="life.html">Студенческая жизнь</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html">Контакты</a></li>
          <li class="nav-item"><a class="btn btn-primary ms-lg-2" href="registration.html">Подать заявку</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h1 class="mb-4">Связаться с нами</h1>
    <div class="row g-5">
      <div class="col-md-5">
        <h2>Наши контакты</h2>
        <p><strong>Адрес:</strong> г. Бишкек, ул. Инженерная 12</p>
        <p><strong>Телефон:</strong> +996 (312) 00-00-00</p>
        <p><strong>Email:</strong> info@engineering.edu</p>
      </div>
      
      <div class="col-md-7">
        <h2>Обратная связь</h2>
        <div id="contactAlert" class="alert d-none" role="alert"></div>
        <form id="contactForm" novalidate>
          <div class="mb-3">
            <label for="contactName" class="form-label">Имя *</label>
            <input type="text" class="form-control" id="contactName" required>
          </div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label">Email *</label>
            <input type="email" class="form-control" id="contactEmail" required>
          </div>
          <div class="mb-3">
            <label for="contactSubject" class="form-label">Тема *</label>
            <input type="text" class="form-control" id="contactSubject" required>
          </div>
          <div class="mb-3">
            <label for="contactMessage" class="form-label">Сообщение *</label>
            <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
          </div>
          <!-- Anti-Spam protection -->
          <div class="mb-3">
            <label for="antiSpam" class="form-label">Защита от спама: Сколько будет 2 + 3? *</label>
            <input type="number" class="form-control" id="antiSpam" required>
          </div>
          <button type="submit" class="btn btn-primary">Отправить сообщение</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container"><p class="mb-0">&copy; 2026 Engineering College.</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
